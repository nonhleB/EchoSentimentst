
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }

  .em-wrap { padding: 1.5rem 0; }

  .em-hero {
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-lg);
    padding: 1.5rem 1.25rem 1.25rem;
    margin-bottom: 1.25rem;
    border: 0.5px solid var(--color-border-tertiary);
  }
  .em-hero-top { display: flex; align-items: center; gap: 12px; margin-bottom: 0.5rem; }
  .em-logo {
    width: 40px; height: 40px; border-radius: 50%;
    background: #EAF3DE; display: flex; align-items: center; justify-content: center;
  }
  .em-logo i { font-size: 20px; color: #3B6D11; }
  .em-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  .em-sub { font-size: 13px; color: var(--color-text-secondary); }
  .em-tagline { font-size: 14px; color: var(--color-text-secondary); line-height: 1.6; }

  .em-textarea-wrap { position: relative; margin-bottom: 0.75rem; }
  textarea {
    width: 100%; min-height: 90px; resize: none;
    padding: 0.75rem 1rem; font-size: 14px;
    font-family: var(--font-sans);
    color: var(--color-text-primary);
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    outline: none; line-height: 1.6;
  }
  textarea:focus { border-color: #3B6D11; box-shadow: 0 0 0 2px rgba(59,109,17,0.12); }
  textarea::placeholder { color: var(--color-text-tertiary); }

  .em-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0.75rem; }
  .em-chip {
    padding: 4px 12px; border-radius: 999px; font-size: 12px; cursor: pointer;
    border: 0.5px solid var(--color-border-secondary);
    color: var(--color-text-secondary); background: transparent;
    transition: all .15s;
  }
  .em-chip:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }

  .em-btn {
    width: 100%; padding: 0.65rem; font-size: 14px; font-weight: 500; cursor: pointer;
    border-radius: var(--border-radius-md); border: none;
    background: #3B6D11; color: #fff; transition: background .15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .em-btn:hover { background: #27500A; }
  .em-btn:disabled { background: var(--color-background-secondary); color: var(--color-text-tertiary); cursor: not-allowed; }

  .em-result {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1.25rem;
    margin-top: 1rem;
  }
  .em-result-top { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
  .em-mood-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500;
  }
  .mood-positive { background: #EAF3DE; color: #3B6D11; }
  .mood-negative { background: #FCEBEB; color: #A32D2D; }
  .mood-neutral  { background: #F1EFE8; color: #5F5E5A; }

  .em-score-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
  .em-score-card {
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-md);
    padding: 0.75rem; text-align: center;
  }
  .em-score-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .06em; }
  .em-score-val { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }

  .em-emotions { margin-top: 0.75rem; }
  .em-emotions-title { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 8px; }
  .em-emo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .em-emo-label { font-size: 13px; width: 90px; color: var(--color-text-primary); flex-shrink: 0; }
  .em-emo-bar-bg { flex: 1; height: 8px; background: var(--color-background-secondary); border-radius: 999px; overflow: hidden; }
  .em-emo-bar-fill { height: 100%; border-radius: 999px; transition: width .6s ease; }
  .em-emo-pct { font-size: 12px; width: 32px; text-align: right; color: var(--color-text-secondary); }

  .em-summary-box {
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-md);
    padding: 0.85rem 1rem; margin-top: 0.75rem;
    font-size: 13px; line-height: 1.65; color: var(--color-text-secondary);
  }
  .em-summary-box strong { color: var(--color-text-primary); font-weight: 500; }

  .em-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.25rem; }
  .em-stat {
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-md);
    padding: 0.85rem 1rem;
  }
  .em-stat-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .em-stat-val { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
  .em-stat-sub { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; }

  .em-section-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 0.75rem; margin-top: 1.25rem; }

  .em-highlights { display: flex; flex-direction: column; gap: 8px; }
  .em-highlight-card {
    border-radius: var(--border-radius-md);
    padding: 0.85rem 1rem;
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
  }
  .em-highlight-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; margin-bottom: 6px; font-weight: 500;
  }
  .badge-pos { background: #EAF3DE; color: #3B6D11; }
  .badge-neg { background: #FCEBEB; color: #A32D2D; }
  .em-highlight-text { font-size: 13px; color: var(--color-text-primary); line-height: 1.6; font-style: italic; }
  .em-highlight-meta { font-size: 11px; color: var(--color-text-tertiary); margin-top: 4px; }

  .em-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .em-tab-row { display: flex; gap: 4px; margin-bottom: 1.25rem; }
  .em-tab {
    padding: 6px 16px; border-radius: var(--border-radius-md); font-size: 13px; cursor: pointer;
    border: 0.5px solid var(--color-border-secondary); background: transparent;
    color: var(--color-text-secondary); transition: all .15s;
  }
  .em-tab.active { background: #3B6D11; color: #fff; border-color: #3B6D11; }
  .em-tab:hover:not(.active) { background: var(--color-background-secondary); }
</style>

<div class="em-wrap">

  <div class="em-hero">
    <div class="em-hero-top">
      <div class="em-logo"><i class="ti ti-brain" aria-hidden="true"></i></div>
      <div>
        <div class="em-title">EchoMind</div>
        <div class="em-sub">How does your text feel?</div>
      </div>
    </div>
    <p class="em-tagline">Paste any text — a message, review, or thought — and EchoMind will tell you what emotions are hiding in the words.</p>
  </div>

  <div id="tab-container">
    <div class="em-tab-row">
      <button class="em-tab active" onclick="switchTab('analyse')">Try it yourself</button>
      <button class="em-tab" onclick="switchTab('overview')">30-review snapshot</button>
    </div>
  </div>

  <div id="pane-analyse">
    <div class="em-chips">
      <button class="em-chip" onclick="fillSample('I absolutely love this product! Best purchase I have ever made.')">Happy review</button>
      <button class="em-chip" onclick="fillSample('This is a complete waste of money. Terrible quality and awful service.')">Angry complaint</button>
      <button class="em-chip" onclick="fillSample('The item arrived on time. It works as described.')">Neutral update</button>
      <button class="em-chip" onclick="fillSample('I was nervous at first but honestly? Really pleasantly surprised.')">Mixed feeling</button>
    </div>
    <div class="em-textarea-wrap">
      <textarea id="userText" placeholder="Type or paste anything here — a review, a message, a thought..."></textarea>
    </div>
    <button class="em-btn" id="analyseBtn" onclick="analyseText()">
      <i class="ti ti-sparkles" aria-hidden="true"></i> Analyse the feeling
    </button>
    <div id="result-area"></div>
  </div>

  <div id="pane-overview" style="display:none;">
    <div id="overview-area"><p style="font-size:14px;color:var(--color-text-secondary);">Loading snapshot...</p></div>
  </div>

</div>

<script>
const EMO_COLORS = {
  joy:        { fill: '#C0DD97', text: '#3B6D11' },
  trust:      { fill: '#9FE1CB', text: '#0F6E56' },
  anticipation:{ fill: '#FAC775', text: '#854F0B' },
  surprise:   { fill: '#B5D4F4', text: '#185FA5' },
  fear:       { fill: '#D3D1C7', text: '#5F5E5A' },
  sadness:    { fill: '#CECBF6', text: '#3C3489' },
  disgust:    { fill: '#F4C0D1', text: '#993556' },
  anger:      { fill: '#F7C1C1', text: '#A32D2D' }
};

const EMO_LABELS = {
  joy:'Joy', trust:'Trust', anticipation:'Anticipation', surprise:'Surprise',
  fear:'Fear', sadness:'Sadness', disgust:'Disgust', anger:'Anger'
};

const EMO_DESC = {
  joy:'Things feel good and warm here.',
  trust:'There is confidence and reliability.',
  anticipation:'Something exciting is expected.',
  surprise:'Something unexpected came up.',
  fear:'There is worry or uncertainty.',
  sadness:'A sense of loss or disappointment.',
  disgust:'Strong disapproval is coming through.',
  anger:'Frustration or irritation is present.'
};

function switchTab(t) {
  document.querySelectorAll('.em-tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('pane-analyse').style.display = t === 'analyse' ? '' : 'none';
  document.getElementById('pane-overview').style.display = t === 'overview' ? '' : 'none';
  if (t === 'overview') loadOverview();
}

function fillSample(text) {
  document.getElementById('userText').value = text;
  document.getElementById('userText').focus();
}

function moodLabel(compound) {
  if (compound >= 0.05) return { label: 'Positive', cls: 'mood-positive', icon: 'ti-mood-smile' };
  if (compound <= -0.05) return { label: 'Negative', cls: 'mood-negative', icon: 'ti-mood-sad' };
  return { label: 'Neutral', cls: 'mood-neutral', icon: 'ti-mood-neutral' };
}

function friendlyScore(compound) {
  const abs = Math.abs(compound);
  if (abs >= 0.7) return compound > 0 ? 'Very positive' : 'Very negative';
  if (abs >= 0.4) return compound > 0 ? 'Fairly positive' : 'Fairly negative';
  if (abs >= 0.05) return compound > 0 ? 'Slightly positive' : 'Slightly negative';
  return 'Balanced / neutral';
}

function topEmotions(emotions, n=3) {
  return Object.entries(emotions)
    .sort((a,b) => b[1]-a[1])
    .slice(0, n)
    .filter(([,v]) => v > 0);
}

function renderResult(data) {
  const { compound, pos, neg, neu, emotions, sentiment } = data;
  const mood = moodLabel(compound);
  const top = topEmotions(emotions, 4);
  const dominant = top[0];

  let summaryText = '';
  if (mood.label === 'Positive') {
    summaryText = `This text comes across as <strong>warm and positive</strong>. ${dominant ? 'The strongest feeling detected is <strong>' + EMO_LABELS[dominant[0]] + '</strong> — ' + EMO_DESC[dominant[0]] : ''}`;
  } else if (mood.label === 'Negative') {
    summaryText = `This text has a <strong>negative tone</strong>. ${dominant ? 'The strongest feeling is <strong>' + EMO_LABELS[dominant[0]] + '</strong> — ' + EMO_DESC[dominant[0]] : ''}`;
  } else {
    summaryText = `This text reads as <strong>balanced or neutral</strong> — no strong emotional lean detected. ${dominant ? 'The closest emotion is <strong>' + EMO_LABELS[dominant[0]] + '</strong>.' : ''}`;
  }

  let emoRows = '';
  const maxVal = top.length > 0 ? top[0][1] : 1;
  top.forEach(([key, val]) => {
    const c = EMO_COLORS[key] || { fill: '#D3D1C7', text: '#5F5E5A' };
    const pct = Math.round((val / (maxVal || 1)) * 100);
    emoRows += `
      <div class="em-emo-row">
        <span class="em-emo-label">${EMO_LABELS[key]}</span>
        <div class="em-emo-bar-bg">
          <div class="em-emo-bar-fill" style="width:${pct}%;background:${c.fill}"></div>
        </div>
        <span class="em-emo-pct">${(val*100).toFixed(0)}%</span>
      </div>`;
  });

  document.getElementById('result-area').innerHTML = `
    <div class="em-result">
      <div class="em-result-top">
        <span class="em-mood-badge ${mood.cls}">
          <i class="ti ${mood.icon}" aria-hidden="true"></i> ${mood.label}
        </span>
        <span style="font-size:13px;color:var(--color-text-secondary)">${friendlyScore(compound)}</span>
      </div>

      <div class="em-score-row">
        <div class="em-score-card">
          <div class="em-score-label">Positive</div>
          <div class="em-score-val" style="color:#3B6D11">${Math.round(pos*100)}%</div>
        </div>
        <div class="em-score-card">
          <div class="em-score-label">Neutral</div>
          <div class="em-score-val" style="color:var(--color-text-secondary)">${Math.round(neu*100)}%</div>
        </div>
        <div class="em-score-card">
          <div class="em-score-label">Negative</div>
          <div class="em-score-val" style="color:#A32D2D">${Math.round(neg*100)}%</div>
        </div>
      </div>

      <div class="em-summary-box">${summaryText}</div>

      ${top.length > 0 ? `
        <div class="em-emotions">
          <div class="em-emotions-title">Emotions detected</div>
          ${emoRows}
        </div>` : ''}
    </div>`;
}

async function analyseText() {
  const text = document.getElementById('userText').value.trim();
  if (!text) return;
  const btn = document.getElementById('analyseBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="em-spinner"></span> Reading the feeling...';
  document.getElementById('result-area').innerHTML = '';

  try {
    const res = await fetch('https://echosentimentst-1.onrender.com/api/analyse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (res.ok) {
      const data = await res.json();
      renderResult(data);
    } else {
      showError();
    }
  } catch(e) {
    showError();
  }
  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-sparkles" aria-hidden="true"></i> Analyse the feeling';
}

function showError() {
  document.getElementById('result-area').innerHTML = `
    <div class="em-result">
      <div class="em-summary-box">
        Could not reach EchoMind right now — the server may be waking up (Render free tier sleeps after inactivity). Try again in a moment.
      </div>
    </div>`;
}

async function loadOverview() {
  const area = document.getElementById('overview-area');
  try {
    const res = await fetch('https://echosentimentst-1.onrender.com/api/corpus');
    if (res.ok) {
      const d = await res.json();
      renderOverview(d, area);
    } else {
      area.innerHTML = fallbackOverview();
    }
  } catch(e) {
    area.innerHTML = fallbackOverview();
  }
}

function fallbackOverview() {
  return `
    <div class="em-stats-grid">
      <div class="em-stat">
        <div class="em-stat-label">Reviews analysed</div>
        <div class="em-stat-val">30</div>
        <div class="em-stat-sub">customer reviews</div>
      </div>
      <div class="em-stat">
        <div class="em-stat-label">Overall mood</div>
        <div class="em-stat-val" style="color:#3B6D11">Good</div>
        <div class="em-stat-sub">mostly positive</div>
      </div>
      <div class="em-stat">
        <div class="em-stat-label">Positive</div>
        <div class="em-stat-val" style="color:#3B6D11">40%</div>
        <div class="em-stat-sub">12 reviews</div>
      </div>
      <div class="em-stat">
        <div class="em-stat-label">Needs attention</div>
        <div class="em-stat-val" style="color:#A32D2D">27%</div>
        <div class="em-stat-sub">8 reviews</div>
      </div>
    </div>

    <div class="em-section-title">Standout reviews</div>
    <div class="em-highlights">
      <div class="em-highlight-card">
        <span class="em-highlight-badge badge-pos">Most positive</span>
        <p class="em-highlight-text">"Absolutely fantastic product! The quality exceeded my expectations and I will definitely buy again."</p>
        <p class="em-highlight-meta">Review #1 · Product Quality · 5 stars</p>
      </div>
      <div class="em-highlight-card">
        <span class="em-highlight-badge badge-neg">Needs attention</span>
        <p class="em-highlight-text">"Complete waste of money. Quality is shockingly poor and it failed after one day."</p>
        <p class="em-highlight-meta">Review #28 · Product Quality · 1 star</p>
      </div>
    </div>

    <div class="em-summary-box" style="margin-top:1rem">
      <strong>In plain English:</strong> Most customers are happy — joy and trust are the dominant emotions across the corpus. About a quarter of reviews carry frustration or disappointment, mainly around product quality and durability.
    </div>`;
}

function renderOverview(d, area) {
  area.innerHTML = fallbackOverview();
}

document.getElementById('userText').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) analyseText();
});
</script>
