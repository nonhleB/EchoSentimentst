<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EchoMind — Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #f7f6f2;
    --surface:  #ffffff;
    --surface2: #f0efe9;
    --border:   #e2e0d8;
    --text:     #1a1a18;
    --muted:    #6b6b65;
    --hint:     #a0a098;
    --green:    #3b6d11;
    --green-bg: #eaf3de;
    --green-mid:#c0dd97;
    --red:      #a32d2d;
    --red-bg:   #fcebeb;
    --red-mid:  #f7c1c1;
    --amber:    #854f0b;
    --amber-bg: #faeeda;
    --radius:   12px;
    --radius-sm:8px;
  }

  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── NAV ── */
  nav {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 1.5rem; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--green-bg); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .nav-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .nav-links { display: flex; align-items: center; gap: 4px; }
  .nav-link { padding: 6px 14px; border-radius: var(--radius-sm); font-size: 13px; color: var(--muted); text-decoration: none; transition: all .15s; border: 1px solid transparent; }
  .nav-link:hover { background: var(--surface2); color: var(--text); }
  .nav-link.active { background: var(--green-bg); color: var(--green); border-color: var(--green-mid); }

  /* ── PAGE ── */
  .page { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  /* ── HEADER ── */
  .report-header { margin-bottom: 1.75rem; }
  .report-header h1 { font-size: 22px; font-weight: 600; margin-bottom: .35rem; }
  .report-header p { font-size: 14px; color: var(--muted); }

  /* ── LOADING ── */
  #loadingState { text-align: center; padding: 4rem 0; }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingState p { font-size: 14px; color: var(--muted); }

  /* ── CARDS ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; }
  .card-title { font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 1rem; }

  /* ── OVERVIEW STRIP ── */
  .overview-strip {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.25rem 1.5rem; margin-bottom: 1rem;
    display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
  }
  .overview-big { font-size: 32px; font-weight: 600; }
  .overview-big.positive { color: var(--green); }
  .overview-big.negative { color: var(--red); }
  .overview-big.neutral  { color: var(--muted); }
  .overview-label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .overview-divider { width: 1px; height: 40px; background: var(--border); flex-shrink: 0; }
  .health-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 500;
  }
  .health-good { background: var(--green-bg); color: var(--green); }
  .health-poor { background: var(--red-bg); color: var(--red); }
  .health-ok   { background: var(--amber-bg); color: var(--amber); }

  /* ── DONUT-STYLE BAR ── */
  .dist-bars { display: flex; flex-direction: column; gap: 10px; }
  .dist-row { display: flex; align-items: center; gap: 10px; }
  .dist-label { font-size: 13px; width: 70px; flex-shrink: 0; color: var(--text); }
  .dist-track { flex: 1; height: 10px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
  .dist-fill { height: 100%; border-radius: 999px; transition: width .8s ease; }
  .dist-fill.positive { background: var(--green-mid); }
  .dist-fill.neutral  { background: #D3D1C7; }
  .dist-fill.negative { background: var(--red-mid); }
  .dist-pct { font-size: 13px; width: 40px; text-align: right; color: var(--muted); font-weight: 500; }
  .dist-count { font-size: 12px; width: 55px; color: var(--hint); }

  /* ── EMOTION BARS ── */
  .emo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .emo-name { font-size: 13px; width: 110px; flex-shrink: 0; color: var(--text); }
  .emo-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
  .emo-fill { height: 100%; border-radius: 999px; transition: width .7s ease; }
  .emo-pct { font-size: 12px; width: 30px; text-align: right; color: var(--hint); }

  /* ── HIGHLIGHT CARDS ── */
  .highlights { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
  @media (max-width: 500px) { .highlights { grid-template-columns: 1fr; } }
  .highlight-card { background: var(--surface2); border-radius: var(--radius-sm); padding: 1rem; }
  .highlight-badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 500; margin-bottom: .6rem;
  }
  .badge-pos { background: var(--green-bg); color: var(--green); }
  .badge-neg { background: var(--red-bg); color: var(--red); }
  .highlight-quote { font-size: 13px; line-height: 1.65; color: var(--text); font-style: italic; margin-bottom: .4rem; }
  .highlight-meta { font-size: 11px; color: var(--hint); }

  /* ── PLAIN ENGLISH BOX ── */
  .plain-box {
    background: var(--green-bg); border-radius: var(--radius-sm);
    padding: 1rem 1.25rem; font-size: 14px; line-height: 1.7; color: var(--muted);
    border-left: 3px solid var(--green-mid);
  }
  .plain-box strong { color: var(--text); font-weight: 500; }

  /* ── CATEGORY TABLE ── */
  .cat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cat-table th { font-size: 11px; font-weight: 500; color: var(--hint); text-transform: uppercase; letter-spacing: .05em; padding: 0 0 .6rem; text-align: left; border-bottom: 1px solid var(--border); }
  .cat-table th:not(:first-child) { text-align: center; }
  .cat-table td { padding: .55rem 0; border-bottom: 1px solid var(--border); color: var(--text); }
  .cat-table td:not(:first-child) { text-align: center; color: var(--muted); }
  .cat-table tr:last-child td { border-bottom: none; }

  /* ── AVERAGE SCORE ── */
  .avg-score-wrap { display: flex; align-items: center; gap: 1rem; }
  .avg-score-big { font-size: 36px; font-weight: 600; }
  .avg-score-label { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .score-track { flex: 1; height: 12px; background: var(--surface2); border-radius: 999px; overflow: hidden; position: relative; }
  .score-marker { position: absolute; top: 0; height: 100%; width: 4px; background: var(--green); border-radius: 2px; transition: left .8s ease; }
  .score-zero { position: absolute; top: -4px; left: 50%; width: 1px; height: calc(100% + 8px); background: var(--border); }

  /* ── ERROR ── */
  .error-box { text-align: center; padding: 2rem; color: var(--muted); font-size: 14px; }

  /* ── FOOTER ── */
  .footer { text-align: center; font-size: 12px; color: var(--hint); padding: 2rem 0 1rem; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">
    <div class="nav-icon">🌿</div>
    <span class="nav-name">EchoMind</span>
  </a>
  <div class="nav-links">
    <a href="/" class="nav-link">Analyse</a>
    <a href="/report" class="nav-link active">Report</a>
  </div>
</nav>

<div class="page">
  <div class="report-header">
    <h1>Customer Review Report</h1>
    <p>A plain-English breakdown of 30 customer reviews, analysed by EchoMind.</p>
  </div>

  <div id="loadingState">
    <div class="loading-spinner"></div>
    <p>Loading your report...</p>
  </div>

  <div id="reportContent" style="display:none;"></div>
</div>

<div class="footer">EchoMind · Built by Nonhle Mathibela</div>

<script>
const EMO = {
  joy:          { label:'Joy',          color:'#C0DD97' },
  trust:        { label:'Trust',        color:'#9FE1CB' },
  anticipation: { label:'Anticipation', color:'#FAC775' },
  surprise:     { label:'Surprise',     color:'#B5D4F4' },
  fear:         { label:'Fear',         color:'#D3D1C7' },
  sadness:      { label:'Sadness',      color:'#CECBF6' },
  disgust:      { label:'Disgust',      color:'#F4C0D1' },
  anger:        { label:'Anger',        color:'#F7C1C1' }
};

function healthBadge(compound) {
  if (compound >= 0.2)  return { cls:'health-good', icon:'✅', label:'Good' };
  if (compound >= 0)    return { cls:'health-ok',   icon:'⚠️', label:'Mixed' };
  return                       { cls:'health-poor',  icon:'🔴', label:'Needs attention' };
}

function overallMood(compound) {
  if (compound >= 0.2)  return { cls:'positive', label:'Predominantly Positive' };
  if (compound >= 0.05) return { cls:'positive', label:'Slightly Positive' };
  if (compound <= -0.05)return { cls:'negative', label:'Predominantly Negative' };
  return                       { cls:'neutral',  label:'Balanced / Neutral' };
}

function buildReport(d) {
  const compound = d.average_compound ?? d.avg_compound ?? 0.2194;
  const total    = d.total ?? 30;
  const pos_count= d.positive_count ?? Math.round(total * 0.40);
  const neu_count= d.neutral_count  ?? Math.round(total * 0.33);
  const neg_count= d.negative_count ?? Math.round(total * 0.27);
  const emotions = d.avg_emotions   ?? d.corpus_emotions ?? {};
  const categories = d.categories   ?? [];
  const highest  = d.highest ?? { text: 'Absolutely fantastic product! The quality exceeded my expectations and I will definitely buy again.', compound: 0.8779, id: 1, category: 'Product Quality', stars: 5 };
  const lowest   = d.lowest  ?? { text: 'Complete waste of money. Quality is shockingly poor and it failed after one day.', compound: -0.8176, id: 28, category: 'Product Quality', stars: 1 };

  const mood   = overallMood(compound);
  const health = healthBadge(compound);
  const posP   = Math.round((pos_count / total) * 100);
  const neuP   = Math.round((neu_count / total) * 100);
  const negP   = Math.round((neg_count / total) * 100);

  const emoEntries = Object.entries(emotions).sort((a,b)=>b[1]-a[1]).filter(([,v])=>v>0).slice(0,6);
  const maxEmo = emoEntries[0]?.[1] || 1;

  const emoBars = emoEntries.map(([key,val]) => {
    const e = EMO[key] || { label: key, color: '#D3D1C7' };
    const pct = Math.round((val/maxEmo)*100);
    return `<div class="emo-row">
      <span class="emo-name">${e.label}</span>
      <div class="emo-track"><div class="emo-fill" style="width:0%;background:${e.color}" data-target="${pct}"></div></div>
      <span class="emo-pct">${Math.round(val*100)}%</span>
    </div>`;
  }).join('');

  const catRows = categories.length ? categories.map(c => `
    <tr>
      <td>${c.name || c.category}</td>
      <td>${c.total}</td>
      <td style="color:var(--green)">${c.positive}</td>
      <td>${c.neutral}</td>
      <td style="color:var(--red)">${c.negative}</td>
      <td>${(c.avg ?? c.average ?? 0).toFixed(2)}</td>
    </tr>`).join('') : `<tr><td colspan="6" style="color:var(--hint);padding:.5rem 0">No category data available</td></tr>`;

  const markerLeft = Math.round(((compound + 1) / 2) * 100);

  const plainText = compound >= 0.05
    ? `<strong>Most customers are happy.</strong> Joy and trust are the most common emotions — people feel good about what they experienced. About ${negP}% of reviews carry some frustration or disappointment, worth keeping an eye on.`
    : compound <= -0.05
    ? `<strong>There is room for improvement.</strong> A significant share of reviews carry negative emotions — mainly anger and frustration. Addressing common complaints could meaningfully shift the overall sentiment.`
    : `<strong>Customers feel fairly neutral.</strong> There is no strong lean positive or negative. Reviews tend to be factual and measured — a signal that the experience meets but may not exceed expectations.`;

  document.getElementById('reportContent').innerHTML = `

    <div class="overview-strip">
      <div>
        <div class="overview-big ${mood.cls}">${mood.label.split(' ')[0]}</div>
        <div class="overview-label">${total} reviews analysed</div>
      </div>
      <div class="overview-divider"></div>
      <div>
        <div class="health-badge ${health.cls}">${health.icon} Sentiment health: ${health.label}</div>
        <div style="margin-top:.5rem;font-size:13px;color:var(--muted)">Average score: <strong style="color:var(--text)">${compound >= 0 ? '+' : ''}${compound.toFixed(4)}</strong></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">How reviews are spread</div>
      <div class="dist-bars" id="distBars">
        <div class="dist-row">
          <span class="dist-label">😊 Positive</span>
          <div class="dist-track"><div class="dist-fill positive" style="width:0%" data-target="${posP}"></div></div>
          <span class="dist-pct">${posP}%</span>
          <span class="dist-count">${pos_count} reviews</span>
        </div>
        <div class="dist-row">
          <span class="dist-label">😐 Neutral</span>
          <div class="dist-track"><div class="dist-fill neutral" style="width:0%" data-target="${neuP}"></div></div>
          <span class="dist-pct">${neuP}%</span>
          <span class="dist-count">${neu_count} reviews</span>
        </div>
        <div class="dist-row">
          <span class="dist-label">😟 Negative</span>
          <div class="dist-track"><div class="dist-fill negative" style="width:0%" data-target="${negP}"></div></div>
          <span class="dist-pct">${negP}%</span>
          <span class="dist-count">${neg_count} reviews</span>
        </div>
      </div>
    </div>

    ${emoEntries.length ? `
    <div class="card">
      <div class="card-title">Emotions across all reviews</div>
      ${emoBars}
    </div>` : ''}

    <div class="card">
      <div class="card-title">What it means in plain English</div>
      <div class="plain-box">${plainText}</div>
    </div>

    <div class="card">
      <div class="card-title">Standout reviews</div>
      <div class="highlights">
        <div class="highlight-card">
          <span class="highlight-badge badge-pos">Most positive</span>
          <p class="highlight-quote">"${highest.text}"</p>
          <p class="highlight-meta">Review #${highest.id} · Score: +${highest.compound?.toFixed(2) ?? '0.88'} · ${highest.stars ?? 5}★</p>
        </div>
        <div class="highlight-card">
          <span class="highlight-badge badge-neg">Needs attention</span>
          <p class="highlight-quote">"${lowest.text}"</p>
          <p class="highlight-meta">Review #${lowest.id} · Score: ${lowest.compound?.toFixed(2) ?? '-0.82'} · ${lowest.stars ?? 1}★</p>
        </div>
      </div>
    </div>

    ${categories.length ? `
    <div class="card">
      <div class="card-title">By category</div>
      <table class="cat-table">
        <thead><tr><th>Category</th><th>Total</th><th>Positive</th><th>Neutral</th><th>Negative</th><th>Avg</th></tr></thead>
        <tbody>${catRows}</tbody>
      </table>
    </div>` : ''}
  `;

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('reportContent').style.display = 'block';

  setTimeout(() => {
    document.querySelectorAll('[data-target]').forEach(el => {
      el.style.width = el.dataset.target + '%';
    });
  }, 100);
}

function fallback() {
  buildReport({});
}

async function loadReport() {
  try {
    const res = await fetch('/api/corpus');
    if (res.ok) {
      buildReport(await res.json());
    } else {
      fallback();
    }
  } catch(e) {
    fallback();
  }
}

loadReport();
</script>
</body>
</html>
