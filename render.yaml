services:
  - type: web
    name: echomind
    env: python
    buildCommand: pip install -r requirements.txt && python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"
    startCommand: gunicorn src.web.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
